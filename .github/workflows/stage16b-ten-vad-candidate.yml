name: Stage 16B TEN VAD Candidate

on:
  push:
    branches:
      - stage16b-ten-vad-candidate
    paths:
      - "scripts/prepare-stage16b-ten-vad.py"
      - ".github/workflows/stage16b-ten-vad-candidate.yml"
      - "scripts/upsert_model.py"
      - "scripts/validate_manifest.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage16b-ten-vad-candidate
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify candidate tooling syntax
        run: |
          python3 -m py_compile \
            scripts/prepare-stage16b-ten-vad.py \
            scripts/upsert_model.py \
            scripts/validate_manifest.py

      - name: Download and verify upstream TEN VAD FP32 asset
        run: python3 scripts/prepare-stage16b-ten-vad.py dist

      - name: Build candidate manifest from immutable production baseline
        run: |
          python3 scripts/upsert_model.py \
            manifests/production.json \
            dist/model-descriptor.json \
            dist/production.json
          python3 scripts/validate_manifest.py dist/production.json

      - name: Verify generated candidate remains upstream-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path("dist")
          metadata = json.loads((root / "package-metadata.json").read_text())
          descriptor = json.loads((root / "model-descriptor.json").read_text())
          assert descriptor["modelId"] == "ten-vad-fp32"
          assert descriptor["runtimeId"] == "sherpa-onnx"
          assert descriptor["runtimeVersionMin"] == "1.13.8"
          assert descriptor["runtimeVersionMax"] == "1.13.8"
          assert descriptor["download"]["packageFormat"] == "SINGLE_FILE"
          assert descriptor["download"]["url"] == metadata["modelUrl"]
          assert descriptor["download"]["sizeBytes"] == 332211
          assert descriptor["download"]["sha256"] == "718cb7eef47e3cf5ddbe7e967a7503f46b8b469c0706872f494dfa921b486206"
          assert descriptor["license"]["redistributionPolicy"] == "UPSTREAM_ONLY"
          assert descriptor["quantization"] == "FP32"
          PY

      - name: Publish/update prerelease candidate manifest only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="candidate-ten-vad-r1"
          assets=(
            dist/model-descriptor.json
            dist/package-metadata.json
            dist/production.json
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" \
              "${assets[@]}" \
              --prerelease \
              --title "Candidate: TEN VAD FP32 r1" \
              --notes "Stage 16B VAD candidate only. The model file is downloaded directly from the sherpa-onnx upstream release and is not mirrored by Voica. Production manifest is unchanged. Technical benchmark inclusion does not constitute approval for production use; TEN-VAD license applicability must be reviewed separately before any production adoption."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: stage16b-ten-vad-candidate-r1
          path: |
            dist/model-descriptor.json
            dist/package-metadata.json
            dist/production.json
          retention-days: 1
