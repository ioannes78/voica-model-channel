name: Prepare Stage 13A Offline ASR and Speaker Candidate

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Voica Stage 13A offline/speaker bundle revision
        required: true
        default: "1"
  pull_request:
    branches:
      - main
    paths:
      - requests/stage13a-offline-speaker-r1.request

permissions:
  contents: write
  pull-requests: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve candidate revision
        shell: bash
        env:
          DISPATCH_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          revision="${DISPATCH_REVISION:-1}"
          echo "REVISION=${revision}" >> "$GITHUB_ENV"

      - name: Prepare pinned upstream offline ASR and CAM++ models
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare-stage13a-offline-speaker.py "$REVISION" dist

      - name: Fetch validated Stage 13A realtime base manifest
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o dist/base-production.json \
            "https://github.com/ioannes78/voica-model-channel/releases/download/candidate-stage13a-streaming-asr-r1/production.json"
          python3 scripts/validate_manifest.py dist/base-production.json

      - name: Generate combined Stage 13A candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/upsert_model.py dist/base-production.json dist/firered-model-descriptor.json dist/step1.json
          python3 scripts/upsert_model.py dist/step1.json dist/qwen3-model-descriptor.json dist/step2.json
          python3 scripts/upsert_model.py dist/step2.json dist/campplus-model-descriptor.json dist/production.json
          python3 scripts/validate_manifest.py dist/production.json

      - name: Publish/update prerelease candidate manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="candidate-stage13a-all-r${REVISION}"
          notes="Stage 13A combined candidate only: 3 realtime ASR models plus FireRedASR2 CTC, Qwen3-ASR 0.6B INT8 and CAM++ zh-cn. Do not promote to production until Android native smoke, ASR/diarization benchmarks and user-confirmed real-device acceptance pass."
          assets=(
            dist/firered-model-descriptor.json
            dist/qwen3-model-descriptor.json
            dist/campplus-model-descriptor.json
            dist/offline-speaker-model-descriptors.json
            dist/production.json
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --prerelease \
              --title "Candidate: Stage 13A all models r${REVISION}" \
              --notes "$notes"
          fi

      - name: Open/update human-gated manifest PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="candidate/stage13a-all-r${REVISION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" origin/main
          cp dist/production.json manifests/production.json
          git add manifests/production.json
          git commit -m "Candidate: Stage 13A all models r${REVISION}" || true
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Candidate: Stage 13A all models r${REVISION}" \
              --body "Do not merge until Voica Stage 13A has passed native smoke, realtime/offline ASR benchmarks, CAM++ diarization benchmark, and user-confirmed real-device acceptance." || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: stage13a-offline-speaker-descriptors
          path: |
            dist/firered-model-descriptor.json
            dist/qwen3-model-descriptor.json
            dist/campplus-model-descriptor.json
            dist/offline-speaker-model-descriptors.json
            dist/production.json
          retention-days: 7
