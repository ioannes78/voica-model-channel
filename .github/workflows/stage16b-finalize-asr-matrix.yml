name: Stage 16B Final Local-File ASR Matrix

on:
  push:
    branches:
      - stage16b-vad-production-promotion
    paths:
      - ".github/workflows/stage16b-finalize-asr-matrix.yml"

permissions:
  contents: write

concurrency:
  group: stage16b-finalize-asr-matrix
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Replace Qwen3 with FunASR Nano in staged production manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          from pathlib import Path

          path = Path("manifests/production.json")
          catalog = json.loads(path.read_text(encoding="utf-8"))

          funasr = {
            "modelId": "funasr-nano-int8",
            "kind": "ASR_LARGE",
            "displayName": "Fun-ASR-Nano INT8",
            "version": "2025-12-30",
            "revision": 1,
            "runtimeId": "sherpa-onnx",
            "runtimeVersionMin": "1.13.8",
            "runtimeVersionMax": None,
            "languages": ["zh", "en", "ja"],
            "capabilities": {
              "supportsStreaming": False,
              "supportsPartial": False,
              "supportsTokenTiming": False,
              "supportsLanguageDetection": False,
              "supportsConfidence": False,
              "supportsInverseTextNormalization": True,
              "supportsSecondPass": True,
              "supportsHotwords": True,
              "executionMode": "OFFLINE",
              "timestampCapability": "NONE",
              "supportsLanguageForcing": True,
              "punctuationMode": "NATIVE",
              "supportedParameters": [
                "numThreads", "maxNewTokens", "temperature", "topP", "seed",
                "language", "itn", "hotwords"
              ]
            },
            "sourceType": "MANAGED_DOWNLOAD",
            "builtinAssetPath": None,
            "download": {
              "packageFormat": "TAR_BZ2",
              "url": "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-funasr-nano-int8-2025-12-30.tar.bz2",
              "mirrors": [],
              "sizeBytes": 841730611,
              "sha256": "eb43d7ccc2e86b243f6a03b7df361033dda66db9523d1a92bf6aca2b50c9476b"
            },
            "installedSizeBytes": 1010070962,
            "files": [
              {"relativePath":"encoder_adaptor.int8.onnx","sizeBytes":238277200,"sha256":"d0246c823f2c34133ae0efee395d8a189c8f92643e3432f866939ee34d34492c","packagePath":"sherpa-onnx-funasr-nano-int8-2025-12-30/encoder_adaptor.int8.onnx"},
              {"relativePath":"llm.int8.onnx","sizeBytes":600339316,"sha256":"7f0c5a508b41474b1b1ec1cdbdefafd2cf8b3642c6915a0a425265b7b7d2c960","packagePath":"sherpa-onnx-funasr-nano-int8-2025-12-30/llm.int8.onnx"},
              {"relativePath":"embedding.int8.onnx","sizeBytes":155583106,"sha256":"a05d2816e284fcca29a5dccb2c14b9edeb638fd983a84cd4a447248889b6a408","packagePath":"sherpa-onnx-funasr-nano-int8-2025-12-30/embedding.int8.onnx"},
              {"relativePath":"Qwen3-0.6B/merges.txt","sizeBytes":1671853,"sha256":"8831e4f1a044471340f7c0a83d7bd71306a5b867e95fd870f74d0c5308a904d5","packagePath":"sherpa-onnx-funasr-nano-int8-2025-12-30/Qwen3-0.6B/merges.txt"},
              {"relativePath":"Qwen3-0.6B/tokenizer.json","sizeBytes":11422654,"sha256":"aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4","packagePath":"sherpa-onnx-funasr-nano-int8-2025-12-30/Qwen3-0.6B/tokenizer.json"},
              {"relativePath":"Qwen3-0.6B/vocab.json","sizeBytes":2776833,"sha256":"ca10d7e9fb3ed18575dd1e277a2579c16d108e32f27439684afa0e10b1440910","packagePath":"sherpa-onnx-funasr-nano-int8-2025-12-30/Qwen3-0.6B/vocab.json"}
            ],
            "compatibility": {"abis":["arm64-v8a"],"minSdk":26,"appVersionMin":92,"appVersionMax":None},
            "license": {
              "id":"Apache-2.0",
              "url":"https://huggingface.co/FunAudioLLM/Fun-ASR-Nano-2512",
              "attribution":"FunAudioLLM Fun-ASR-Nano-2512; k2-fsa sherpa-onnx INT8 conversion 2025-12-30",
              "redistributionPolicy":"UPSTREAM_ONLY"
            },
            "sourceUrl":"https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-funasr-nano-int8-2025-12-30.tar.bz2",
            "homepage":"https://k2-fsa.github.io/sherpa/onnx/funasr-nano/pretrained.html",
            "releaseChannel":"production",
            "autoUpdateEligible":False,
            "deprecated":False,
            "criticalUpdate":False,
            "runtimeModelType":"funasr-nano",
            "quantization":"INT8"
          }

          original_ids = [m["modelId"] for m in catalog["models"]]
          if "qwen3-asr-0.6b-int8" not in original_ids:
              raise SystemExit("expected Qwen3 production entry is missing")
          models = [m for m in catalog["models"] if m["modelId"] not in {"qwen3-asr-0.6b-int8", "funasr-nano-int8"}]
          models.append(funasr)
          models.sort(key=lambda item: item["modelId"])

          catalog["models"] = models
          catalog["manifestVersion"] = int(catalog["manifestVersion"]) + 1
          catalog["publishedAt"] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          compact = json.dumps(models, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
          catalog["manifestDigest"] = hashlib.sha256(compact).hexdigest()
          catalog["signature"] = None
          catalog["keyId"] = None
          path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          final_ids = {m["modelId"] for m in models}
          assert "sensevoice-2024-int8" in final_ids
          assert "funasr-nano-int8" in final_ids
          assert "qwen3-asr-0.6b-int8" not in final_ids
          assert "fsmn-vad-int8" in final_ids
          print("manifestVersion", catalog["manifestVersion"])
          print("manifestDigest", catalog["manifestDigest"])
          PY

      - name: Validate staged production manifest
        run: python3 scripts/validate_manifest.py manifests/production.json

      - name: Commit staged production matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/production.json
          git commit -m "feat(stage16b): select FunASR Nano for high-quality local ASR"
          git push origin HEAD:stage16b-vad-production-promotion
