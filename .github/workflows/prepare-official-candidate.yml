name: Prepare Official Upstream Candidate

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model
        required: true
        type: choice
        options:
          - punctuation
          - sensevoice
      revision:
        description: Voica model revision
        required: true
        default: "1"

permissions:
  contents: write
  pull-requests: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Stage 8 candidate order
        env:
          MODEL: ${{ inputs.model }}
        run: |
          python3 - "$MODEL" manifests/production.json <<'PY'
          import json
          import sys

          model = sys.argv[1]
          with open(sys.argv[2], "r", encoding="utf-8") as f:
              production = json.load(f)
          present = {item["modelId"] for item in production["models"]}
          required = {
              "punctuation": {"zipformer-small-bilingual"},
              "sensevoice": {
                  "zipformer-small-bilingual",
                  "ct-transformer-zh-en-int8",
              },
          }[model]
          missing = sorted(required - present)
          if missing:
              raise SystemExit(
                  "candidate order violation: merge/validate prerequisites first: "
                  + ", ".join(missing)
              )
          PY

      - name: Verify official package and generate descriptor
        run: |
          python3 scripts/prepare-official-model.py             "${{ inputs.model }}"             "${{ inputs.revision }}"             dist

      - name: Generate candidate production manifest
        run: |
          python3 scripts/upsert_model.py             manifests/production.json             dist/model-descriptor.json             dist/production.json
          python3 scripts/validate_manifest.py dist/production.json

      - name: Publish/update prerelease candidate manifest
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model }}
          REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          tag="candidate-${MODEL}-r${REVISION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/model-descriptor.json \
              dist/production.json \
              --clobber
          else
            gh release create "$tag" \
              dist/model-descriptor.json \
              dist/production.json \
              --prerelease \
              --title "Candidate: ${MODEL} r${REVISION}" \
              --notes "Candidate manifest only. The model package remains on the pinned official upstream release. Do not merge the manifest PR until Android package/file verification, native sherpa smoke activation, and the relevant real-device transcription acceptance pass."
          fi

      - name: Open/update human-gated manifest PR
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model }}
          REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          branch="candidate/${MODEL}-r${REVISION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          cp dist/production.json manifests/production.json
          git add manifests/production.json
          git commit -m "Candidate: ${MODEL} r${REVISION}" || true
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            if ! gh pr create \
              --base main \
              --head "$branch" \
              --title "Candidate: ${MODEL} r${REVISION}" \
              --body "Do not merge until Voica Android has downloaded the candidate, passed package/file verification, native sherpa smoke activation, and the relevant real-device transcription acceptance."; then
              echo "::warning::GitHub Actions is not permitted to create pull requests. Candidate branch '$branch' is ready for a maintainer to open manually."
              echo "Manual PR: https://github.com/${{ github.repository }}/compare/main...${branch}?expand=1"
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.model }}-candidate-r${{ inputs.revision }}
          path: |
            dist/model-descriptor.json
            dist/production.json
          retention-days: 7
